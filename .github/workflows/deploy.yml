# Publica la web en GitHub Pages en cada push a master.
# Requisito (una sola vez): Settings → Pages → Source: "GitHub Actions".
name: Deploy a GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si hay dos publicaciones a la vez, gana la última
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # La web queda en https://<usuario>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Opcional: con el secreto VITE_TMDB_TOKEN usa TMDB; sin él, modo demo.
          # Ojo: la clave queda visible en el JavaScript publicado.
          VITE_TMDB_TOKEN: ${{ secrets.VITE_TMDB_TOKEN }}

      # GitHub Pages no conoce las rutas de la app (/series, /titulo/…):
      # al recargar en una de ellas sirve 404.html, que es la misma app.
      - name: Fallback para rutas de la app
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
